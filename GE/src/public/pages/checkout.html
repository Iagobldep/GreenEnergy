<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../tema.css">
    <link rel="stylesheet" href="checkout.css">
    <script type="module" src="../js/paginas/checkout.js"></script>
    <title>Finalizar compra | GreenEnergy</title>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <a href="../index.html" class="logo">🌿 Green Energy</a>
            <div class="nav-links">
                <a href="../index.html">Início</a>
                <a href="catalogo.html">Catálogo</a>
                <a href="carrinho.html" class="active">Carrinho</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="checkout-card">
            <h1>Finalizar compra</h1>
            <p class="descricao">Informe os dados para emitir sua nota fiscal.</p>

            <div class="resumo">
                <span>Total da compra</span>
                <strong id="totalCompra">Carregando...</strong>
            </div>

            <form id="formCheckout">
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        inputmode="numeric"
                        maxlength="14"
                        placeholder="000.000.000-00"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="tipoPagamento">Tipo de pagamento</label>
                    <select id="tipoPagamento" required>
                        <option value="">Selecione uma opção</option>
                        <option value="pix">PIX</option>
                        <option value="cartao">Cartão</option>
                        <option value="boleto">Boleto</option>
                    </select>
                </div>

                <p id="mensagemCheckout" aria-live="polite"></p>
                <button id="confirmarCompra" type="submit">Confirmar compra</button>
            </form>

            <a class="voltar" href="carrinho.html">← Voltar para o carrinho</a>
        </section>
    </main>
</body>
</html>
