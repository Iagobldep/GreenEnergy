<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <script src="../js/formularios/cadastro.js" defer></script>
    <title>Cadastro | GreenEnergy</title>
</head>
<body>
    <main class="container">
        <div class="cadastro-card">
            <a href="../index.html" class="logo">🌿 GreenEnergy</a>

            <h1>Crie sua conta</h1>
            <p class="descricao">Faça parte de um futuro mais sustentável.</p>

            <form id="formCadastro">
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Digite seu email" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Crie uma senha" required>
                </div>

                <div class="campo">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" placeholder="Digite seu endereço" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" placeholder="Digite seu telefone" required>
                </div>

                <p id="mensagemCadastro"></p>

                <button type="submit">Criar minha conta</button>
            </form>

            <p class="login">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>

            <a href="../index.html" class="voltar">← Voltar para o início</a>
        </div>
    </main>
</body>
</html>
