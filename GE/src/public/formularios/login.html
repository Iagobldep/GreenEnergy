<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <script src="../js/formularios/login.js" defer></script>
    <title>Login | GreenEnergy</title>
</head>
<body>
    <main class="container">
        <div class="login-card">
            <a href="../index.html" class="logo">🌿 GreenEnergy</a>

            <h1>Bem-vindo de volta!</h1>
            <p class="descricao">Entre na sua conta e continue fazendo escolhas sustentáveis.</p>

            <form id="formLogin">
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>

                <p id="mensagemLogin"></p>

                <button type="submit">Entrar</button>
            </form>

            <p class="cadastro">
                Ainda não tem uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

            <a href="../index.html" class="voltar">← Voltar para o início</a>
        </div>
    </main>
</body>
</html>
